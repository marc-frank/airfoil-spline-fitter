<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Airfoil Spline Fitter</title>
  <meta name="description" content="B-spline fitting of airfoil coordinates for CAD, in the browser: the fewest control points within a tolerance, exported to STEP, IGES or DXF.">
  <!-- The browser version of the app (packaging/web). Build: trunk build --release (from this folder). -->
  <link data-trunk rel="rust" data-bin="spline-fitter" data-wasm-opt="s" />
  <link data-trunk rel="copy-file" href="assets/app_icon.png" />
  <link rel="icon" type="image/png" href="app_icon.png">
  <link rel="apple-touch-icon" href="app_icon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(236, 236, 236); }
    @media (prefers-color-scheme: dark) { html, body { background: rgb(40, 40, 40); color: rgb(200, 200, 200); } }
    canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               font: 14px system-ui, sans-serif; color: rgb(110, 110, 110); }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading" role="status">Loading Airfoil Spline Fitter&hellip;</div>
</body>
</html>
