<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Airfoil Spline Fitter</title>
  <meta name="description" content="B-spline fitting of airfoil coordinates for CAD, in the browser: the fewest control points within a tolerance, exported to STEP, IGES or DXF.">
  <!-- The browser version of the app (packaging/web). Build: trunk build --release (from this folder). -->
  <link data-trunk rel="rust" data-bin="spline-fitter" data-wasm-opt="s" />
  <!-- Fits run in this web worker (crates/spline-fitter-worker), so the page stays responsive. -->
  <link data-trunk rel="rust" href="../spline-fitter-worker/Cargo.toml" data-bin="fit-worker" data-type="worker" data-loader-shim data-wasm-opt="s" />
  <link data-trunk rel="copy-file" href="web/fs.js" />
  <link data-trunk rel="copy-file" href="web/sw.js" />
  <link data-trunk rel="copy-file" href="web/manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="assets/app_icon.png" />
  <link data-trunk rel="copy-file" href="assets/fonts/Selawik-OFL.txt" data-target-path="licences" />
  <link data-trunk rel="copy-file" href="assets/fonts/CascadiaMono-OFL.txt" data-target-path="licences" />
  <link rel="icon" type="image/png" href="app_icon.png">
  <link rel="apple-touch-icon" href="app_icon.png">
  <!-- Installable as an app; works offline once loaded (web/sw.js). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#282828">
  <script src="fs.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(236, 236, 236); }
    @media (prefers-color-scheme: dark) { html, body { background: rgb(40, 40, 40); color: rgb(200, 200, 200); } }
    canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               font: 14px system-ui, sans-serif; color: rgb(110, 110, 110); }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading" role="status">Loading Airfoil Spline Fitter&hellip;</div>
  <script>
    // Leaving with unsaved runs or a running fit: the browser asks first (the app sets the flag).
    addEventListener("beforeunload", (e) => {
      if (window.splineFitterUnsaved) { e.preventDefault(); e.returnValue = ""; }
    });
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
