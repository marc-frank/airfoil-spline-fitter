[package]
name = "spline-fitter-worker"
version = "0.1.0"
description = "The browser version's fitting worker: runs fits off the page's thread"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Built by Trunk as a web worker (crates/spline-fitter-gui/index.html); on the
# desktop it is an empty program.
[[bin]]
name = "fit-worker"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
spline-fitter = { path = "../spline-fitter" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
web-time = "1"
