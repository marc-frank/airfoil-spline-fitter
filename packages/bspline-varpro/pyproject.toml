[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bspline-varpro"
dynamic = ["version"]
description = "CAD-grade B-spline curve fitting: tolerance-driven knots, geometric G1-G3 continuity, STEP/IGES/DXF export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Airfoil Library Project" }
]
keywords = [
    "b-spline",
    "spline",
    "curve-fitting",
    "variable-projection",
    "varpro",
    "levenberg-marquardt",
    "least-squares",
    "parameterization",
    "airfoil",
    "cad",
    "step",
    "iges",
    "dxf",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.version]
path = "src/bspline_varpro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bspline_varpro"]

[tool.hatch.build.targets.sdist]
include = ["src/bspline_varpro", "tests", "benchmarks", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
