[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spline-fitter"
version = "2.0.0"
description = "Professional B-spline curve fitting tool for airfoil coordinates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Airfoil Library Project" }
]
keywords = [
    "airfoil",
    "spline",
    "b-spline",
    "curve-fitting",
    "optimization",
    "aerodynamics",
    "pyqt6"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.8",
    "bspline-varpro>=1.0",
    "PyQt6>=6.2",
    "pyqtgraph>=0.13",
    "chime>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
spline-fitter = "spline_fitter.__main__:main"

[project.gui-scripts]
spline-fitter-gui = "spline_fitter.__main__:main"

[project.urls]
Homepage = "https://github.com/airfoil-library/spline-fitter"
Documentation = "https://github.com/airfoil-library/spline-fitter#readme"
Issues = "https://github.com/airfoil-library/spline-fitter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spline_fitter"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
