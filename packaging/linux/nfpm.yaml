# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH. After SolidCraft's packaging/linux/nfpm.yaml (Apache-2.0).
name: spline-fitter
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 2.1.0-rc.1 becomes 2.1.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: Airfoil Spline Fitter contributors
license: MIT
description: |-
  B-spline fitting of airfoil coordinates for CAD
  The fewest control points that keep every point within a tolerance, with
  geometric G1-G3 continuity where sections meet, written exactly to STEP,
  IGES or DXF.

# The binary links glibc, libgcc_s and ALSA directly. Windowing (X11/Wayland, xkbcommon) and
# OpenGL are loaded at runtime with dlopen, so they aren't ELF NEEDED entries: list them here.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libasound2 | libasound2t64
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libegl1 | libgl1
    recommends:
      - xdg-desktop-portal
  rpm:
    # Soname provides rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE.
    depends:
      - libasound.so.2()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - (libEGL.so.1()(64bit) or libGL.so.1()(64bit))
    recommends:
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/spline-fitter
    dst: /usr/bin/spline-fitter
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
